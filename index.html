<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おあしすフィールド Engine V10</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=10.0.0">
</head>
<body>

<div class="game-shell">

  <header class="topbar">
    <div>
      <h1><span class="desktop-label">おあしすフィールド</span><span class="mobile-label">G.F.1</span></h1>
      <p>Engine V10 / 奇跡習得・特殊効果・守護神対応</p>
    </div>
    <div class="top-actions">
      <a class="admin-link" href="admin.html" aria-label="管理メニュー">
        <span class="desktop-label">管理メニュー</span><span class="mobile-label">⚙</span>
      </a>
      <button id="restartBtn" aria-label="最初から">
        <span class="desktop-label">最初から</span><span class="mobile-label">↻</span>
      </button>
    </div>
  </header>

  <div class="sound-toolbar">
    <label for="volumeSlider"><span aria-hidden="true">🔊</span><span>SE音量</span></label>
    <input id="volumeSlider" type="range" min="0" max="100" value="35" aria-label="カード効果音の音量">
    <output id="volumeValue" for="volumeSlider">35%</output>
  </div>

  <main class="game-layout">

    <section class="battle-stage panel">
      <div class="stage-heading">
        <div class="stage-title">バトル</div>
        <div id="phaseBadge" class="phase-badge">あなたのターン</div>
      </div>
      <p id="battleMessage" class="battle-message">カードを選んでください。</p>
      <div id="hitResult" class="hit-result hidden"></div>

      <div class="combat-flow">
        <div class="combat-side">
          <div id="arenaAttackerName" class="combat-name">攻撃側</div>
          <div id="arenaAttackCard" class="combat-card empty">攻撃カードなし</div>
        </div>

        <div class="combat-center">
          <div class="vs-mark">VS</div>
          <div id="calcView" class="calc-view">攻撃 0 - 防御 0 = 0</div>
          <div id="damageView" class="damage-view">待機中</div>
        </div>

        <div class="combat-side">
          <div id="arenaDefenderName" class="combat-name">防御側</div>
          <div id="arenaDefenseCards" class="combat-card-list empty">防御カードなし</div>
        </div>
      </div>

      <div class="battle-controls">
        <div class="action-row">
          <button id="prayBtn" class="pray-btn">✨ 祈る</button>
        </div>
        <div id="interactionPanel" class="interaction-panel hidden"></div>
      </div>
    </section>

    <section class="players-panel panel">
      <div class="panel-title">プレイヤーリスト</div>

      <div id="enemyPanel" class="player-card targetable">
        <div class="player-status-row">
          <strong>CPU</strong>
          <div class="player-resources">
            <b id="enemyHpText">HP 40</b>
            <span id="enemyMpText">MP 10</span>
            <span id="enemyGoldText">￥ 20</span>
          </div>
        </div>
        <div id="enemyEffects" class="player-effects hidden">
          <span id="enemyStatusText" class="status-text hidden"></span>
          <div id="enemyGuardian" class="guardian-badge hidden"></div>
        </div>
      </div>

      <div id="playerPanel" class="player-card me targetable">
        <div class="player-status-row">
          <strong>あなた</strong>
          <div class="player-resources">
            <b id="playerHpText">HP 40</b>
            <span id="playerMpText">MP 10</span>
            <span id="playerGoldText">￥ 20</span>
          </div>
        </div>
        <div id="playerEffects" class="player-effects hidden">
          <span id="playerStatusText" class="status-text hidden"></span>
          <div id="playerGuardian" class="guardian-badge hidden"></div>
        </div>
      </div>
    </section>

    <section class="hand-panel panel">
      <div class="hand-header">
        <div>
          <div class="panel-title">手札</div>
          <p id="handHelp">カードを選ぶと右下に詳細が表示されます。</p>
        </div>
      </div>
      <div id="playerHand" class="hand-grid"></div>
      <div id="learnedMagicSection" class="learned-magic-section hidden">
        <div class="learned-magic-title">習得した奇跡 <span id="learnedMagicCount">0 / 6</span></div>
        <div id="learnedMagicList" class="learned-magic-list"></div>
      </div>
    </section>

    <section class="detail-panel panel">
      <div class="panel-title">カード詳細</div>
      <div id="cardDetail" class="card-detail empty-detail">
        カードを選択すると詳細を表示します。
      </div>
    </section>

  </main>
</div>

<script src="card-effects.js?v=10.0.0"></script>
<script src="card-storage.js?v=10.0.0"></script>
<script src="catalog.js?v=10.0.0"></script>
<script src="cards.js?v=10.0.0"></script>
<script src="guardians.js?v=10.0.0"></script>
<script src="engine.js?v=10.0.0"></script>
<script src="cpu.js?v=10.0.0"></script>
<script src="script.js?v=10.0.0"></script>
</body>
</html>
