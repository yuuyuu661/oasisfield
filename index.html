<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おあしすフィールド Engine V9</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=9.3.0">
</head>
<body>

<div class="game-shell">

  <header class="topbar">
    <div>
      <h1>おあしすフィールド</h1>
      <p>Engine V9 / 確率抽選・ゴールド・取引対応</p>
    </div>
    <div class="top-actions">
      <a class="admin-link" href="admin.html">管理メニュー</a>
      <button id="restartBtn">最初から</button>
    </div>
  </header>

  <main class="game-layout">

    <section class="battle-stage panel">
      <div class="stage-heading">
        <div class="stage-title">バトル</div>
        <div id="phaseBadge" class="phase-badge">あなたのターン</div>
      </div>
      <p id="battleMessage" class="battle-message">カードを選んでください。</p>
      <div id="hitResult" class="hit-result hidden"></div>

      <div class="combat-flow">
        <div class="combat-side">
          <div id="arenaAttackerName" class="combat-name">攻撃側</div>
          <div id="arenaAttackCard" class="combat-card empty">攻撃カードなし</div>
        </div>

        <div class="combat-center">
          <div class="vs-mark">VS</div>
          <div id="calcView" class="calc-view">攻撃 0 - 防御 0 = 0</div>
          <div id="damageView" class="damage-view">待機中</div>
        </div>

        <div class="combat-side">
          <div id="arenaDefenderName" class="combat-name">防御側</div>
          <div id="arenaDefenseCards" class="combat-card-list empty">防御カードなし</div>
        </div>
      </div>

      <div class="battle-controls">
        <div id="targetBox" class="target-box hidden">
          <button id="targetSelfBtn" class="ghost-btn">自分を選択</button>
          <button id="targetEnemyBtn" class="primary-btn">CPUを選択</button>
          <button id="cancelSelectBtn" class="ghost-btn">選択解除</button>
        </div>
        <div class="action-row">
          <button id="confirmDefenseBtn" class="primary-btn hidden">防御確定</button>
          <button id="prayBtn" class="ghost-btn">祈る</button>
        </div>
        <div id="interactionPanel" class="interaction-panel hidden"></div>
      </div>
    </section>

    <section class="players-panel panel">
      <div class="panel-title">プレイヤーリスト</div>

      <div id="enemyPanel" class="player-card targetable">
        <div class="player-card-top">
          <strong>CPU</strong>
          <span id="enemyPhaseText">待機中</span>
        </div>
        <div class="hp-line">
          <b id="enemyHpText">HP 40</b>
        </div>
        <div class="resource-line"><span id="enemyMpText">MP 10</span><span id="enemyGoldText">￥20</span><span id="enemyStatusText">正常</span></div>
        <div id="enemyHandCount" class="hand-count">手札 9</div>
        <div id="enemyGuardian" class="guardian-badge">守護神なし</div>
      </div>

      <div id="playerPanel" class="player-card me targetable">
        <div class="player-card-top">
          <strong>あなた</strong>
          <span id="playerPhaseText">行動可能</span>
        </div>
        <div class="hp-line">
          <b id="playerHpText">HP 40</b>
        </div>
        <div class="resource-line"><span id="playerMpText">MP 10</span><span id="playerGoldText">￥20</span><span id="playerStatusText">正常</span></div>
        <div id="playerHandCount" class="hand-count">手札 9</div>
        <div id="playerGuardian" class="guardian-badge">守護神なし</div>
      </div>
    </section>

    <section class="hand-panel panel">
      <div class="hand-header">
        <div>
          <div class="panel-title">手札</div>
          <p id="handHelp">カードを選ぶと右下に詳細が表示されます。</p>
        </div>
      </div>
      <div id="playerHand" class="hand-grid"></div>
    </section>

    <section class="log-panel panel">
      <div class="panel-title">ログ</div>
      <div id="logList" class="log-list"></div>
    </section>

    <section class="detail-panel panel">
      <div class="panel-title">カード詳細</div>
      <div id="cardDetail" class="card-detail empty-detail">
        カードを選択すると詳細を表示します。
      </div>
    </section>

  </main>
</div>

<script src="card-effects.js?v=9.3.0"></script>
<script src="card-storage.js?v=9.3.0"></script>
<script src="catalog.js?v=9.3.0"></script>
<script src="cards.js?v=9.3.0"></script>
<script src="guardians.js?v=9.3.0"></script>
<script src="engine.js?v=9.3.0"></script>
<script src="cpu.js?v=9.3.0"></script>
<script src="script.js?v=9.3.0"></script>
</body>
</html>
